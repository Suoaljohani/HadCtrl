# Signed IPA for registered devices (G7/G8, spec §32). Manual, from main only,
# after the full test workflow passes on the same commit. Signing material
# lives only in the protected `ios-signing` environment.
name: HadCtrl signed IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  sign:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-signing
    env:
      HC_XCODE_VERSION: ${{ vars.HC_XCODE_VERSION || '26.3' }}
      HC_XCODEGEN_VERSION: '2.43.0'
      HC_XCODEGEN_SHA256: 'a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f'
      HC_APP_BUNDLE_ID: ${{ vars.HC_APP_BUNDLE_ID }}
      HC_APPLE_TEAM_ID: ${{ vars.HC_APPLE_TEAM_ID }}
      HC_SUPABASE_URL: ${{ vars.HC_SUPABASE_URL }}
      HC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select verified Xcode
        shell: bash
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${HC_XCODE_VERSION}.app"
          test -d "$app" || { echo "Xcode not found: $app" >&2; exit 1; }
          sudo xcode-select --switch "$app/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${HC_XCODEGEN_VERSION}/xcodegen.zip"
          echo "${HC_XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: bash scripts/generate-project.sh
      - name: Archive, sign, export, and verify
        shell: bash
        env:
          HC_CERTIFICATE_BASE64: ${{ secrets.HC_CERTIFICATE_BASE64 }}
          HC_P12_PASSWORD: ${{ secrets.HC_P12_PASSWORD }}
          HC_PROVISION_PROFILE_BASE64: ${{ secrets.HC_PROVISION_PROFILE_BASE64 }}
          HC_KEYCHAIN_PASSWORD: ${{ secrets.HC_KEYCHAIN_PASSWORD }}
        run: bash scripts/sign-and-export.sh
      - name: Upload verified IPA only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HadCtrl-IPA-build${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hadctrl-delivery/HadCtrl.ipa
            ${{ runner.temp }}/hadctrl-delivery/SHA256SUMS.txt
            ${{ runner.temp }}/hadctrl-delivery/BUILD_REPORT.txt
            ${{ runner.temp }}/hadctrl-delivery/dSYMs.zip
          if-no-files-found: error
          retention-days: 14
