# UNSIGNED device build (Release config, production backend) for owner-side
# re-signing with their own Apple ID. No secrets, read-only token. The artifact
# is named UNSIGNED and is not an installable release (spec §32).
name: HadCtrl unsigned device build
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hadctrl-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HC_XCODE_VERSION: ${{ vars.HC_XCODE_VERSION || '26.3' }}
      HC_XCODEGEN_VERSION: '2.43.0'
      HC_XCODEGEN_SHA256: 'a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch "/Applications/Xcode_${HC_XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${HC_XCODEGEN_VERSION}/xcodegen.zip"
          echo "${HC_XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: bash scripts/generate-project.sh
      - name: Build unsigned device IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Secret scan of the build
        run: bash scripts/check-no-secrets.sh "$RUNNER_TEMP/hadctrl-unsigned"
      - name: Upload (UNSIGNED)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HadCtrl-UNSIGNED-build${{ github.run_number }}
          path: ${{ runner.temp }}/hadctrl-unsigned/
          if-no-files-found: error
          retention-days: 14
