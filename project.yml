# XcodeGen project definition (source of truth for HadCtrl.xcodeproj).
# Regenerate with:  xcodegen generate --spec project.yml
# The pinned XcodeGen version is recorded in DECISIONS.md and scripts/generate-project.sh.
name: HadCtrl
options:
  bundleIdPrefix: invalid.hadctrl.placeholder   # replaced by HC_APP_BUNDLE_ID at signing time
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  generateEmptyDirectories: false
  transitivelyLinkDependencies: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  # Official Supabase Swift SDK, pinned exactly (D-19). Transitive versions are
  # locked by Config/Package.resolved, which CI installs into the generated project.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.7
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  HadCtrl:
    type: application
    platform: iOS
    sources:
      - path: HadCtrl
        excludes:
          - "**/*.md"
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: HadCtrl
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_APP_BUNDLE_ID)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Tokens are declared by hand in DesignSystem/Tokens.swift.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HadCtrl/Resources/Info.plist
        # Signing comes from variables so command-line overrides never touch the
        # Swift package targets (which reject provisioning profiles).
        CODE_SIGN_STYLE: $(HC_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(HC_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(HC_PROVISIONING_PROFILE)
        # Push entitlement only when the signing profile includes Push Notifications
        # (sign-and-export.sh with HC_ENABLE_PUSH=1); empty otherwise (D-36).
        CODE_SIGN_ENTITLEMENTS: $(HC_CODE_SIGN_ENTITLEMENTS)
        DEVELOPMENT_TEAM: $(HC_APPLE_TEAM_ID)
  HadCtrlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HadCtrlTests]
    dependencies:
      - target: HadCtrl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_APP_BUNDLE_ID).tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HadCtrl.app/HadCtrl
  HadCtrlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HadCtrlUITests]
    dependencies:
      - target: HadCtrl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: HadCtrl
schemes:
  HadCtrl:
    shared: true
    build:
      targets:
        HadCtrl: all
        HadCtrlTests: [test]
        HadCtrlUITests: [test]
    run:
      config: Debug
      environmentVariables:
        HC_APP_ENV: demo
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HadCtrlTests
        - HadCtrlUITests
      environmentVariables:
        HC_APP_ENV: ui-testing
    archive:
      config: Release
